<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GaConPro V1.0.22 — Tải Hàng Loạt &amp; Studio Phái Sinh AI</title>
    <meta name="description" content="GaConPro V1.0.22 — Nền tảng tải video đa nền tảng hàng loạt (Bilibili, YouTube, TikTok, Douyin, Facebook) và Studio AI tạo video phái sinh hàng loạt bằng FFmpeg." />
    <meta property="og:title" content="GaConPro V1.0.22 — Tải Hàng Loạt &amp; Studio Phái Sinh AI" />
    <meta property="og:description" content="Tải hàng loạt đa nền tảng, tách tập Bilibili tự động, xóa logo, gắn thương hiệu và Studio AI dựng video phái sinh 3 giai đoạn." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bilibatch_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#070913] dark:text-slate-100 antialiased selection:bg-violet-500/35 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
